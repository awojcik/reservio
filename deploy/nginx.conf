# Rezervio reverse proxy. Placeholders are filled in by deploy/setup.sh:
#   __SERVER_NAME__  apex + www, or "_" for IP-only
#   __WEB_PORT__     3000
#   __API_PORT__     3001
#
# One origin, two upstreams:
#
#   https://rezervio.pl/       → web   (Next.js standalone)
#   https://rezervio.pl/api/   → api   (NestJS, global prefix /api)
#
# Same origin on purpose, rather than api.rezervio.pl. The session is an
# HttpOnly cookie with SameSite=Lax, the API refuses a cross-site state-changing
# request by Origin, and NEXT_PUBLIC_API_URL is baked into the browser bundle at
# build time. Keeping the API under the site's own origin means no CORS
# preflight on the hot path, no second certificate, and no cookie-domain
# special case — the least invasive routing for the code as it stands.

server {
    listen 80;
    listen [::]:80;
    # Apex + www; certbot adds the matching 443 blocks and the redirect.
    server_name __SERVER_NAME__;

    # Photos and tiles are large; everything else is small and compresses well.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API caps its own JSON body at 1 MiB. Photos are a separate matter:
    # with external object storage they never touch nginx at all, and with
    # MinIO on the droplet they pass through the storage location below,
    # which raises this on its own.
    client_max_body_size 2m;

    # Object storage, only when it runs here. setup.sh writes this file: the
    # storage location when STORAGE=minio, an empty comment otherwise — so
    # nginx never fails on a missing include, and an unused path never
    # proxies to a port with nothing behind it.
    include /etc/nginx/snippets/rezervio-storage.conf;

    # Build output is content-hashed, so it can be cached indefinitely.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The API keeps its /api prefix: `proxy_pass` without a trailing slash
    # passes the URI through untouched. Rewriting it here would mean the app's
    # own routes, its OpenAPI document and every link it generates disagreed
    # with the address the browser used.
    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API trusts this to decide whether the request arrived over TLS,
        # which is what makes the session cookie Secure. Without it every
        # login would set a cookie the browser then refuses to send back.
        proxy_set_header X-Forwarded-Proto $scheme;

        # A payment provider signs the exact bytes it sent, so the webhook body
        # must arrive unmodified. Buffering is fine — rewriting is not, and
        # nothing here rewrites.
        proxy_request_buffering on;
        proxy_read_timeout 60s;

        # Responses carry Set-Cookie and the correlation id; neither may be
        # cached by anything in between.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
