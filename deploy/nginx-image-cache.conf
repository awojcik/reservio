# Rezervio — on-disk cache for optimised photos. Installed by deploy/setup.sh
# to /etc/nginx/conf.d/, because `proxy_cache_path` and `map` belong to the
# `http` context and the site file is a `server` block.
#
# Why cache in nginx at all, when Next has a cache of its own: this droplet has
# one vCPU, and re-encoding a 600 KB photo to 1200px costs it about 1.5s of
# sharp. Next's cache lives inside the container, so every deploy — and we
# recreate containers on every deploy — throws it away and the next visitor
# pays that cost again for every photo on the page. Here it survives the
# container, and nginx serves a hit without waking Next at all.
#
# 1 GB is roughly a few thousand optimised variants, on a 70 GB disk.
#
# The parent directory has to exist: nginx creates the last segment of this
# path and no more, and Debian ships no /var/cache/nginx at all, so without it
# `nginx -t` fails with `mkdir() ... failed (2: No such file or directory)`.
# deploy/setup.sh creates it, and CI creates it before its own `nginx -t`.
proxy_cache_path /var/cache/nginx/rezervio-images
                 levels=1:2
                 keys_zone=rezervio_images:10m
                 max_size=1g
                 inactive=30d
                 use_temp_path=off;

# Next serves AVIF, WebP or the original format from the same URL, chosen by
# the request's Accept header, and says so with `Vary: Accept`. Caching on the
# raw header would fragment the cache per browser build, so it is folded into
# the three answers that actually differ. Order matters: nginx tries regular
# expressions in the order written, and a browser that takes AVIF takes WebP
# too.
map $http_accept $rezervio_image_variant {
    default        fallback;
    "~*image/avif" avif;
    "~*image/webp" webp;
}
